# 3D-Dächer (LoD2) für die Objektakte der App – Zusatzpakete „lod2-berlin“ und „lod2-brandenburg“ (nur auf Wunsch
# geladen, ältere Apps übergehen sie): vereinfachte Dachnetze je Kachel aus den amtlichen 3D-Gebäudemodellen
#   Berlin:      SenSBW, dl-de/zero-2.0          – gdi.berlin.de (ATOM)
#   Brandenburg: © GeoBasis-DE/LGB, dl-de/by-2.0 – data.geobasis-bb.de
# Erzeuger tools/erzeugen/lod2-dach-erzeugen.py aus dem privaten Repo Cyberdeck (Secret CYBERDECK_LESEN). Die ZIPs
# laufen als Datenstrom durch (keine Platte); gegen die 6-h-Grenze ist jedes Land auf mehrere Runner verteilt (teile).
#
# - von Hand: neu erzeugen, ins aktuelle Release (ziel=release) oder in die Vorabfassung probe-objektakte (ziel=probe);
#   „hoechstens“ begrenzt die ZIPs je Teil (Probe der Dauer und Größe)
# - vierteljährlich: neu erzeugen (die Modelle ändern sich selten)
# - nach jedem Daten-Lauf (neues Release): die Pakete aus dem vorigen Release übernehmen (ohne neu zu erzeugen)
name: LoD2

on:
  schedule:
    - cron: "41 1 12 1,4,7,10 *"
  workflow_run:
    workflows: [Daten]
    types: [completed]
  workflow_dispatch:
    inputs:
      laender:
        description: "berlin, brandenburg oder beide (mit Komma)"
        default: berlin,brandenburg
      ref:
        description: "Zweig von Cyberdeck mit dem Erzeuger (leer: zweig= aus auftrag.txt)"
        default: ""
      ziel:
        description: "release (aktuelles Release, die App sieht es) oder probe (Vorabfassung probe-objektakte)"
        default: probe
      hoechstens:
        description: "nur so viele ZIPs je Teil (0 = alle)"
        default: "0"

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    outputs:
      teile: ${{ steps.plan.outputs.teile }}
      laender: ${{ steps.plan.outputs.laender }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          WAHL: ${{ inputs.laender || 'berlin,brandenburg' }}
          REF: ${{ inputs.ref }}
          ZIEL: ${{ inputs.ziel || 'release' }}
        run: |
          zweig=$(grep -v '^#' auftrag.txt | grep '^zweig=' | head -1 | cut -d= -f2 | tr -d ' \r')
          echo "ref=${REF:-${zweig:-main}}" >> "$GITHUB_OUTPUT"
          if [ "$ZIEL" = probe ]; then tag=probe-objektakte; else tag=$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Ziel: $tag"
          # Teile je Land: Brandenburg ~19 300 kleine ZIPs, Berlin ~925 große
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          wahl = [l.strip() for l in os.environ["WAHL"].split(",") if l.strip()]
          anzahl = {"berlin": 2, "brandenburg": 6}
          assert wahl and all(l in anzahl for l in wahl), wahl
          teile = [{"land": l, "teil": i, "teile": anzahl[l]} for l in wahl for i in range(anzahl[l])]
          print("teile=" + json.dumps(teile))
          print("laender=" + json.dumps(wahl))
          EOF

  teil:
    name: ${{ matrix.land }} ${{ matrix.teil }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.teile) }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: feinschmeckerr/Cyberdeck
          ref: ${{ needs.plan.outputs.ref }}
          token: ${{ secrets.CYBERDECK_LESEN }}
          path: piflux
      - name: Dächer lesen (${{ matrix.land }}, Teil ${{ matrix.teil }} von ${{ matrix.teile }})
        working-directory: piflux
        run: |
          python3 -m unittest tests.test_lod2_dach
          /usr/bin/time -v python3 tools/erzeugen/lod2-dach-erzeugen.py teil --land ${{ matrix.land }} \
            --teile ${{ matrix.teile }} --teil ${{ matrix.teil }} --hoechstens "${{ inputs.hoechstens || 0 }}" \
            --ziel ../teil-${{ matrix.land }}-${{ matrix.teil }}.sqlite 2> zeit.txt || { tail -20 zeit.txt; exit 1; }
          grep -E "Elapsed|Maximum resident" zeit.txt
          ls -la ..
      - uses: actions/upload-artifact@v4
        with:
          name: lod2-${{ matrix.land }}-${{ matrix.teil }}
          path: teil-${{ matrix.land }}-${{ matrix.teil }}.sqlite
          retention-days: 3
          compression-level: 1

  zusammen:
    name: Zusammen ${{ matrix.land }}
    needs: [plan, teil]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        land: ${{ fromJSON(needs.plan.outputs.laender) }}
    env:
      LAND: ${{ matrix.land }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: daten
      - uses: actions/checkout@v5
        with:
          repository: feinschmeckerr/Cyberdeck
          ref: ${{ needs.plan.outputs.ref }}
          token: ${{ secrets.CYBERDECK_LESEN }}
          path: piflux
      - uses: actions/download-artifact@v4
        with:
          pattern: lod2-${{ matrix.land }}-*
          merge-multiple: true
          path: teile
      - name: Zusammenfügen und packen
        run: |
          ls -la teile
          python3 piflux/tools/erzeugen/lod2-dach-erzeugen.py zusammen --land "$LAND" --ziel "ergebnis/lod2.sqlite" teile/*.sqlite
          rm -rf teile
          lizenz=$(python3 -c "import sqlite3; print(sqlite3.connect('ergebnis/lod2.sqlite').execute(\"SELECT wert FROM info WHERE schluessel='lizenz'\").fetchone()[0])")
          zusatz=$(LIZ="$lizenz" python3 -c 'import json,os; print(json.dumps({"art": "lod2", "fuer": os.environ["LAND"], "optional": True, "lizenz": os.environ["LIZ"]}, ensure_ascii=False))')
          python3 daten/werkzeuge/packen.py "lod2-$LAND" ergebnis aus "$zusatz"
      - uses: actions/upload-artifact@v4
        with:
          name: paket-lod2-${{ matrix.land }}
          path: aus
          retention-days: 3
          compression-level: 0

  veroeffentlichen:
    name: Veröffentlichen
    needs: [plan, zusammen]
    if: ${{ !cancelled() && needs.zusammen.result != 'skipped' }}
    runs-on: ubuntu-latest
    # wie Welt und Fahrplan: alle schreiben pakete.json neu – nacheinander
    concurrency:
      group: welt
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: paket-lod2-*
          merge-multiple: true
          path: aus
      - name: Hochladen und Verzeichnis
        run: |
          ls -la aus
          gh release upload "$TAG" -R "${{ github.repository }}" --clobber aus/*
          mkdir manifeste
          gh release download "$TAG" -R "${{ github.repository }}" -D manifeste --pattern '*.json'
          rm -f manifeste/pakete.json
          python3 werkzeuge/verzeichnis.py manifeste "$TAG" > pakete.json
          python3 -c 'import json; d=json.load(open("pakete.json")); [print(l["land"], round(l["gz_groesse"]/1e6), "MB") for l in d["laender"]]'
          gh release upload "$TAG" -R "${{ github.repository }}" --clobber pakete.json

  uebernehmen:
    name: Aus dem vorigen Release übernehmen
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: welt
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: lod2-* ins neue Release
        run: |
          repo="${{ github.repository }}"
          neu=$(gh release view -R "$repo" --json tagName -q .tagName)
          if gh release view "$neu" -R "$repo" --json assets -q '.assets[].name' | grep -q '^lod2-'; then
            echo "$neu hat die LoD2-Pakete schon"; exit 0
          fi
          alt=""
          for tag in $(gh release list -R "$repo" --limit 30 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == false) | .tagName'); do
            [ "$tag" = "$neu" ] && continue
            if gh release view "$tag" -R "$repo" --json assets -q '.assets[].name' | grep -q '^lod2-'; then alt=$tag; break; fi
          done
          [ -n "$alt" ] || { echo "Kein Release mit LoD2-Paketen – nichts zu übernehmen"; exit 0; }
          echo "übernehme aus $alt nach $neu"
          mkdir aus
          gh release download "$alt" -R "$repo" -D aus --pattern 'lod2-*'
          ls -la aus
          gh release upload "$neu" -R "$repo" --clobber aus/*
          mkdir manifeste
          gh release download "$neu" -R "$repo" -D manifeste --pattern '*.json'
          rm -f manifeste/pakete.json
          python3 werkzeuge/verzeichnis.py manifeste "$neu" > pakete.json
          gh release upload "$neu" -R "$repo" --clobber pakete.json
