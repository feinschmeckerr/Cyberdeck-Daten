# Prüft die Daten-Werkzeuge dieses Repos (tests/, ohne Rohdaten und ohne pyosmium) bei jedem Push und Pull Request.
name: Prüfen

on:
  push:
    paths: ["werkzeuge/**", "tests/**", ".github/workflows/pruefen.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: python3 -m unittest discover -s tests -v
