# Probe für Bahnhöfe und Gebäudeteile (werkzeuge/bahnhof.py, werkzeuge/gebaeudeteile.py) ohne Release: baut für ein
# Land Merkmale und 3D-Gebäude mit den Erzeugern des gewählten Zweigs von Cyberdeck, ergänzt sie mit den Werkzeugen
# dieses Repos und meldet Abdeckung (Aufzüge und Bahnsteige mit level, Rolltreppen, Teile mit bp …) und Größen vorher/
# nachher in der Zusammenfassung. Lädt nichts hoch und ändert kein Release. Läuft von Hand und bei Änderungen an den
# Werkzeugen auf Arbeitszweigen (claude/…), dann für Berlin.
name: Bahnhof (Probe)

on:
  push:
    branches: ["claude/**"]
    paths: [werkzeuge/bahnhof.py, werkzeuge/gebaeudeteile.py, .github/workflows/bahnhof-probe.yml]
  workflow_dispatch:
    inputs:
      land:
        description: "Land (Kennung wie bei der Geofabrik)"
        default: berlin
      ref:
        description: "Zweig von Cyberdeck mit den Erzeugern"
        default: ios

permissions:
  contents: read

concurrency:
  group: bahnhof-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ inputs.land || 'berlin' }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    env:
      LANG: C.UTF-8
      LAND: ${{ inputs.land || 'berlin' }}
      GEOFABRIK: https://download.geofabrik.de/europe/germany
    steps:
      - name: Debian-Pakete (wie im Daten-Lauf)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git python3 python3-numpy \
            python3-pyosmium > /dev/null
      - uses: actions/checkout@v5
        with:
          path: daten
      - uses: actions/checkout@v5
        with:
          repository: feinschmeckerr/Cyberdeck
          ref: ${{ inputs.ref || 'ios' }}
          token: ${{ secrets.CYBERDECK_LESEN }}
          path: piflux
      - name: Tests der Werkzeuge
        run: cd daten && python3 -m unittest discover -s tests
      - name: Rohdaten laden
        working-directory: piflux
        run: |
          mkdir -p kartendaten/osm
          curl -fL --retry 5 --retry-delay 20 -sS -o "kartendaten/osm/$LAND-latest.osm.pbf" "$GEOFABRIK/$LAND-latest.osm.pbf"
          curl -fL --retry 5 --retry-delay 20 -sS -o "kartendaten/osm/$LAND-latest.osm.pbf.md5" "$GEOFABRIK/$LAND-latest.osm.pbf.md5"
          ( cd kartendaten/osm && md5sum -c --quiet "$LAND-latest.osm.pbf.md5" )
      - name: Merkmale und 3D-Gebäude (Erzeuger des PiFlux)
        working-directory: piflux
        run: |
          python3 tools/erzeugen/merkmale-erzeugen.py
          python3 tools/erzeugen/gebaeude-erzeugen.py --ohne-lod2
          mkdir -p ../vorher
          cp kartendaten/merkmale.sqlite kartendaten/gebaeude.mbtiles ../vorher/
      - name: Werkzeuge dieses Repos
        working-directory: piflux
        run: |
          /usr/bin/time -v python3 ../daten/werkzeuge/bahnhof.py kartendaten/merkmale.sqlite kartendaten/osm/*.osm.pbf \
            2> zeit.txt || { cat zeit.txt; exit 1; }
          grep -E "Elapsed|Maximum resident" zeit.txt
          /usr/bin/time -v python3 ../daten/werkzeuge/gebaeudeteile.py kartendaten/gebaeude.mbtiles kartendaten/osm/*.osm.pbf \
            2> zeit.txt || { cat zeit.txt; exit 1; }
          grep -E "Elapsed|Maximum resident" zeit.txt
      - name: Abdeckung, Größen und Gegenprobe
        run: python3 daten/werkzeuge/probe_bericht.py vorher piflux/kartendaten | tee -a "$GITHUB_STEP_SUMMARY"
