# Einmaliges Aufräumen: entfernt die Vorabfassung „probe-objektakte“ samt Tag. Diese Datei wird danach gelöscht.
name: Objektakte (Probe aufräumen)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Vorabfassung und Tag löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete probe-objektakte --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
